identity:
  author: antom
  name: antom_mcp_tools
  label:
    en_US: Antom MCP Tools
    zh_Hans: Antom MCP 工具
  description:
    en_US: Apply for the Antom MCP merchant allowlist before authorizing tool calls in Dify. See the README for onboarding.
    zh_Hans: 请先申请 Antom MCP 商户白名单，获批后在 Dify 授权调用工具。新用户入驻入口见 README。
  icon: icon.svg
  tags: [business, utilities]
oauth_schema:
  client_schema:
    - name: oauth_state_key
      type: secret-input
      required: true
      label:
        en_US: OAuth state encryption key
        zh_Hans: OAuth 状态加密密钥
      help:
        en_US: Generate a Fernet key locally as described in README. This is not an Antom merchant key.
        zh_Hans: 按 README 在本地生成 Fernet 密钥；此项不是 Antom 商户密钥。
      url: https://cryptography.io/en/latest/fernet/
  credentials_schema:
    - name: access_token
      type: secret-input
      label: {en_US: Access token, zh_Hans: 访问令牌}
    - name: refresh_token
      type: secret-input
      label: {en_US: Refresh token, zh_Hans: 刷新令牌}
    - name: client_id
      type: secret-input
      label: {en_US: Registered OAuth client, zh_Hans: 动态注册的 OAuth 客户端}
tools:
  - tools/discover.yaml
  - tools/query.yaml
extra:
  python:
    source: provider/antom.py
